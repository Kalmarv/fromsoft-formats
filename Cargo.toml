[package]
name = "fromsoft-formats"
description = "Checked readers for Sekiro and Elden Ring data: BHD5 archives, DCX, BND4, FLVER, MSB, TPF, MTD/MATBIN, params and more"
keywords = ["fromsoftware", "sekiro", "elden-ring", "flver", "modding"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/fromsoft-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
havok-formats.workspace = true
thiserror.workspace = true
serde.workspace = true
encoding_rs.workspace = true
half.workspace = true
aes.workspace = true
num-bigint.workspace = true
sha2.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
dxcontainer.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/fromsoft-formats"
publish = false

[workspace.dependencies]
aes = { version = "=0.9.3", default-features = false }
dxcontainer = { git = "https://github.com/Kalmarv/dx", rev = "fecc8636a59acb038c7e798766a4160b031a6047" }
encoding_rs = { version = "=0.8.42", default-features = false, features = ["alloc"] }
half = { version = "=2.7.1", default-features = false }
havok-formats = { git = "https://github.com/Kalmarv/havok-formats", rev = "c5f3da2097808d1b7e7023cc747cd36914871ffc" }
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "05dc616e7bd14cad63c4e5218be6e8b79cee60ce" }
primase-testdata = { git = "https://github.com/Kalmarv/primase-testdata", rev = "71a28a5b188b259e1d49681823aa00996260f544" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
