[package]
name = "fromsoft-formats"
description = "Checked readers for Sekiro and Elden Ring data (BHD5 archives, DCX, BND4, FLVER, MSB, TPF, MTD/MATBIN, params and more), and writers for DCX, BND4, TPF, FMG, PARAM and regulation.bin"
keywords = ["fromsoftware", "sekiro", "elden-ring", "flver", "modding"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
exclude = ["docs/"]
documentation = "https://docs.rs/fromsoft-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
havok-formats.workspace = true
thiserror.workspace = true
serde.workspace = true
encoding_rs.workspace = true
half.workspace = true
aes.workspace = true
flate2.workspace = true
num-bigint.workspace = true
sha2.workspace = true
md-5.workspace = true
zstd.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
dxcontainer.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/fromsoft-formats"
publish = true

[workspace.dependencies]
aes = { version = "=0.9.3", default-features = false }
dxcontainer = { version = "0.4.0", git = "https://github.com/Kalmarv/dx", rev = "39883bd084ad1db1f66416f41b25cf2529f9eec1" }
encoding_rs = { version = "=0.8.42", default-features = false, features = ["alloc"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
half = { version = "=2.7.1", default-features = false }
havok-formats = { version = "0.9.0", git = "https://github.com/Kalmarv/havok-formats", rev = "eb2aba273217c2ece6e5a59981ddfd6b41a02497" }
md-5 = { version = "=0.11.0", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }
primase-foundations = "0.3.2"
primase-testdata = { version = "0.1.6", git = "https://github.com/Kalmarv/primase-testdata", rev = "62b344c8ad5c9659e72c3ebb1ee4800a01ffabc0" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
xxhash-rust = { version = "=0.8.19", default-features = false, features = ["xxh3"] }
zstd = { version = "=0.13.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
